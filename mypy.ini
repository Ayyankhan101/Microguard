[mypy]

[mypy-micrograd.*]
ignore_missing_imports = True

# mlflow ships only with the [mlflow] extra, so a base install has no stubs
# for it and `mypy microguard` would fail on a machine that never intends to
# talk to Databricks. tracking.py imports it lazily for exactly that reason.
[mypy-mlflow.*]
ignore_missing_imports = True

# The same holds for what the [mlflow] extra brings in with it. tracking.py
# imports databricks.sdk and numpy inside the functions that need them, so an
# install without the extra is valid and mypy should not fail on it. This only
# applies when a package is missing: an installed numpy is still type-checked.
[mypy-databricks.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-microguard.vulture_whitelist]
ignore_errors = True
