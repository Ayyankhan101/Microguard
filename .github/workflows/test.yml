name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The live extra must be installed even where no Redis server runs:
          # microguard/live/__init__.py raises ImportError without redis-py, and
          # every tests/live/ module imports microguard.live at import time, so a
          # base install turns the whole directory into a COLLECTION ERROR rather
          # than a skip. The Redis-backed tests themselves skip cleanly without a
          # server; the `live` job below provides one.
          pip install -e ".[live,fastapi,flask,dashboard]"
          # httpx/httpx2 back starlette's TestClient — see requirements-dev.txt.
          pip install pytest pytest-cov httpx httpx2

      - name: Run tests
        # --cov-fail-under holds the line. Coverage reached 100% by fixing
        # tests that passed for the wrong reason, not by padding; without a
        # gate that erodes on the next PR. Two points of headroom so a
        # legitimate pragma-less branch does not block a merge.
        #
        # microguard/live is omitted HERE and gated in the `live` job instead.
        # There is no Redis on this runner, so every Redis-backed test skips and
        # this job cannot execute that code at all. Measuring it here does not
        # gate anything -- it just reports a number that falls as the live path
        # grows, which is what it did: 93% on a branch that is 100% covered when
        # the tests can actually run. The code is still gated, by a job that can
        # run it.
        run: >
          python -m pytest tests/ -v --tb=short
          --cov=microguard --cov-report=term-missing --cov-fail-under=98
          --cov-config=.coveragerc-matrix

      - name: Test CLI
        shell: bash
        run: |
          set +e
          output=$(microguard scan data/sample_access.log 2>&1)
          code=$?
          echo "$output"
          # microguard exits 1 by design when it detects bot traffic (it
          # does, in this sample log) — that's not a failure. A traceback
          # or a missing report header means the CLI actually broke.
          if echo "$output" | grep -q "Traceback (most recent call last)"; then
            echo "::error::CLI crashed with a traceback"
            exit 1
          fi
          if ! echo "$output" | grep -q "Microguard Bot Traffic Report"; then
            echo "::error::CLI did not produce the expected report output (exit code $code)"
            exit 1
          fi
          echo "CLI ran successfully (exit code $code)"

  live:
    # Service containers need a Linux runner, so the Redis-backed suite runs
    # here rather than across the full matrix. Without this job every test in
    # tests/live/ skips and the session store ships unverified.
    name: live (Redis-backed)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[live,fastapi,flask,dashboard]"
          # pytest-cov: this job carries the coverage gate for microguard/live,
          # which the matrix cannot measure without a Redis.
          pip install pytest pytest-cov httpx httpx2

      - name: Run live suite against a real Redis
        # Coverage for microguard/live is gated HERE, because this is the only
        # job with a Redis to run it against. The matrix omits it for exactly
        # that reason. Between the two jobs every line is still gated.
        run: >
          python -m pytest tests/live/ -v --tb=short
          --cov=microguard.live --cov-report=term-missing --cov-fail-under=98

      - name: Fail if the live suite silently skipped
        run: |
          # A skipped Redis suite looks identical to a passing one in the
          # summary. This job exists to run those tests, so treat a skip as
          # a failure rather than a green check.
          python -m pytest tests/live/ -q -rs 2>&1 | tee /tmp/live.txt
          if grep -q "Redis not available" /tmp/live.txt; then
            echo "::error::live suite skipped - the Redis service did not come up"
            exit 1
          fi

  browser:
    # The fingerprint script makes two claims no other test can check: that the
    # hash actually varies with the environment, and that only the hash leaves
    # the page. Canvas and WebGL do not exist under Node, so a unit test would
    # pass with every probe returning a constant.
    #
    # One runner, not the matrix: downloading a browser twelve times to assert
    # the same JavaScript behavior buys nothing.
    name: browser (fingerprint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[live]"
          pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run the browser suite
        run: python -m pytest tests/browser/ -v --tb=short

      - name: Fail if the browser suite silently skipped
        run: |
          # A skipped browser suite looks identical to a passing one. This job
          # exists to run it, so a skip is a failure here.
          python -m pytest tests/browser/ -q -rs 2>&1 | tee /tmp/browser.txt
          if grep -qE "need playwright|chromium not installed" /tmp/browser.txt; then
            echo "::error::browser suite skipped - playwright or chromium is missing"
            exit 1
          fi

  gui:
    # The TypeScript dashboard. Node is needed to build and test it; running
    # `microguard dashboard` never is, because the build ships in the wheel.
    name: gui (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[live,fastapi,flask,dashboard]"
          pip install httpx httpx2
          cd gui && npm ci

      - name: Typecheck
        run: cd gui && npx tsc -b

      - name: Test
        run: cd gui && npm test

      - name: Build
        run: cd gui && npm run build

      - name: Fail if the captured fixtures have drifted from the API
        run: |
          # gui/src/api/__fixtures__ holds real payloads, and the zod schemas
          # are checked against them. If the Python side changes shape and the
          # fixtures are not recaptured, the schemas keep passing against stale
          # data and the drift only shows up in a browser.
          python gui/scripts/capture_fixtures.py
          if ! git diff --exit-code -- gui/src/api/__fixtures__; then
            echo "::error::API fixtures are stale - run 'python gui/scripts/capture_fixtures.py' and commit the result"
            exit 1
          fi

  typecheck:
    # mypy is in the health stack and requirements-dev.txt, but no job ran it.
    # So a local run reported 17 errors that CI never saw: redis-py 5.0.1 types
    # Redis.from_url as returning None, and the live extra allowed it.
    #
    # One runner: a type check gives the same answer on every OS. Python 3.10
    # because it is the oldest version setup.py supports, and mypy checks the
    # stdlib API of the interpreter it runs under -- checking on 3.13 would pass
    # a call that does not exist on 3.10.
    #
    # Same extras as the matrix, deliberately without [mlflow]: tracking.py
    # imports it lazily, so a checkout without it is a supported install and
    # must type-check too.
    name: typecheck (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[live,fastapi,flask,dashboard]"
          # Pinned so a new mypy release cannot turn an unrelated PR red. Bump
          # it on purpose, in its own change.
          pip install "mypy==2.3.1"

      - name: Run mypy
        run: mypy microguard
