# Self-contained nginx for the local lab. Runs under a custom prefix, binds
# loopback only, and reproduces the production auth_request contract from
# scripts/provision-collector.sh. real_ip_header pulls each simulated actor's
# X-Forwarded-For up into $remote_addr, so both the access log and the /check
# call see the actor's IP rather than 127.0.0.1.
worker_processes 1;
daemon off;
pid __PREFIX__/nginx.pid;
error_log __PREFIX__/error.log warn;
events { worker_connections 256; }
http {
    access_log __PREFIX__/access.log combined;
    default_type text/html;
    types { text/html html; text/plain txt; application/json json; application/javascript js; }

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    limit_req_zone $binary_remote_addr zone=microguard_fp:1m rate=600r/m;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root __PREFIX__/site;

        location = /_microguard_check {
            internal;
            proxy_pass http://127.0.0.1:8400/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Referer $http_referer;
        }

        location = /microguard/fp {
            proxy_pass http://127.0.0.1:8400/fp;
            limit_req zone=microguard_fp burst=20 nodelay;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
        }
        location = /microguard/fingerprint.js { proxy_pass http://127.0.0.1:8400/fingerprint.js; }

        location / {
            auth_request /_microguard_check;
            try_files $uri $uri/ =404;
        }
    }
}
