# nginx for a real-human collection session. Same auth_request contract as
# scripts/provision-collector.sh, but fronted by an HTTPS tunnel (cloudflared or
# ngrok) instead of a public IP. The tunnel connects from loopback and passes
# the visitor's real IP in a header; __REALIP_HEADER__ lifts it into $remote_addr
# so the session key and the fingerprint binding use the real client, not the
# tunnel. Nothing is ever blocked here — microguard serve runs observe-only.
worker_processes 1;
daemon off;
pid __PREFIX__/nginx.pid;
error_log __PREFIX__/error.log warn;
events { worker_connections 512; }
http {
    access_log __PREFIX__/access.log combined;
    default_type text/html;
    types { text/html html; text/plain txt; application/json json; application/javascript js; }

    # The tunnel daemon connects over loopback, so trust it to have set the
    # real client IP header. cloudflared uses CF-Connecting-IP; ngrok uses
    # X-Forwarded-For. The launcher fills the right one in.
    set_real_ip_from 127.0.0.1;
    real_ip_header __REALIP_HEADER__;
    real_ip_recursive off;

    limit_req_zone $binary_remote_addr zone=microguard_fp:1m rate=600r/m;

    server {
        listen 127.0.0.1:8080;
        server_name _;
        root __PREFIX__/site;

        location = /_microguard_check {
            internal;
            proxy_pass http://127.0.0.1:__SERVE_PORT__/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Referer $http_referer;
        }

        location = /microguard/fp {
            proxy_pass http://127.0.0.1:__SERVE_PORT__/fp;
            limit_req zone=microguard_fp burst=20 nodelay;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
        }
        location = /microguard/fingerprint.js {
            proxy_pass http://127.0.0.1:__SERVE_PORT__/fingerprint.js;
        }

        # The honeypot: hidden from people, disallowed in robots.txt, so any
        # hit is a crawler/bot. evaluate labels those bot; people never reach it.
        location = /_hp/archive {
            auth_request /_microguard_check;
            return 200 "no\n";
        }

        location / {
            auth_request /_microguard_check;
            try_files $uri $uri/ =404;
        }
    }
}
