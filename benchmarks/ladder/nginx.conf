# The evasion ladder's nginx. Same auth_request contract as scripts/lab/nginx.conf
# and scripts/provision-collector.sh, plus an app surface (/search, /login) so
# attack tools have something to aim at. Loopback only. real_ip_header lifts each
# actor's X-Forwarded-For into $remote_addr, so the access log and /check both
# see the actor's assigned IP.
worker_processes 2;
daemon off;
pid __PREFIX__/nginx.pid;
error_log __PREFIX__/error.log warn;
events { worker_connections 1024; }
http {
    access_log __PREFIX__/access.log combined;
    default_type text/html;
    types { text/html html; text/plain txt; application/json json; application/javascript js; }

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    limit_req_zone $binary_remote_addr zone=microguard_fp:1m rate=600r/m;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root __PREFIX__/site;

        location = /_microguard_check {
            internal;
            proxy_pass http://127.0.0.1:8400/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Referer $http_referer;
        }

        location = /microguard/fp {
            proxy_pass http://127.0.0.1:8400/fp;
            limit_req zone=microguard_fp burst=20 nodelay;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
        }
        location = /microguard/fingerprint.js { proxy_pass http://127.0.0.1:8400/fingerprint.js; }

        # Every login attempt is checked, then refused. The static handler
        # answers a POST with 405, which error_page turns into the 401 a real
        # app would send; /denied.html is internal-only, so the redirect is not
        # checked (or logged as a request) a second time.
        location = /login {
            auth_request /_microguard_check;
            error_page 405 =401 /denied.html;
            try_files /login.html =404;
        }
        location = /denied.html { internal; }

        location = /search {
            auth_request /_microguard_check;
            try_files /search.html =404;
        }

        location / {
            auth_request /_microguard_check;
            try_files $uri $uri/ =404;
        }
    }
}
